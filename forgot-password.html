<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Identity | TaskFlow Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #E96A2C;
            --primary-hover: #D05A21;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-premium {
            background: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(233, 106, 44, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(233, 106, 44, 0.4);
        }

        .input-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(233, 106, 44, 0.1);
        }
    </style>
</head>

<body class="bg-[#FAFAFA] flex min-h-screen items-center justify-center p-6">

    <div
        class="w-full max-w-md bg-white p-12 rounded-[3rem] shadow-2xl border border-slate-100 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>

        <div class="mb-12 flex flex-col items-center text-center">
            <div class="w-12 h-12 bg-[#E96A2C] rounded-xl flex items-center justify-center text-white shadow-lg shadow-orange-500/20 mb-6 active:scale-95 transition-all cursor-pointer"
                onclick="window.location.href='login.html'">
                <span class="material-icons-round">bolt</span>
            </div>
            <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight font-display">Identity Recovery</h1>
            <p class="text-slate-500 font-medium text-lg leading-relaxed">Enter your neural identifier to receive an
                authorization link.</p>
        </div>

        <form id="recoveryForm" class="space-y-8 relative z-10">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-3">Neural
                    Identifier</label>
                <input type="email" id="email" placeholder="name@company.com"
                    class="w-full px-6 py-5 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-lg input-premium"
                    required>
            </div>

            <button type="submit"
                class="w-full btn-premium text-white py-6 rounded-2xl font-black text-lg tracking-widest uppercase active:scale-[0.98] transition-all">
                Send Recovery Link
            </button>

            <a href="login.html"
                class="block text-center text-xs font-bold text-slate-400 uppercase tracking-widest hover:text-slate-900 transition-colors mt-8">Return
                to Central Auth</a>
        </form>
    </div>

    <div id="toastContainer" class="fixed top-10 right-10 z-[100] flex flex-col gap-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex bg-white items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-slate-100 min-w-[320px] transition-all duration-500 transform translate-y-20 opacity-0`;

            const colorClass = isError ? 'text-rose-500' : 'text-[#E96A2C]';
            const icon = isError ? 'error_outline' : 'verified';

            toast.innerHTML = `
                <div class="w-10 h-10 ${isError ? 'bg-rose-50' : 'bg-orange-50'} rounded-xl flex items-center justify-center ${colorClass} shrink-0">
                    <span class="material-icons-round text-xl">${icon}</span>
                </div>
                <div>
                    <span class="font-bold text-slate-900 block text-sm">Security Pulse</span>
                    <span class="text-xs text-slate-500">${message}</span>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        document.getElementById('recoveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            const email = document.getElementById('email').value;

            btn.innerText = 'Transmitting...';
            btn.disabled = true;

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                showToast('Recovery link dispatched. Check your inbox.');
                btn.innerText = 'Link Dispatched';

            } catch (err) {
                showToast(err.message || 'Transmission failed', true);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
