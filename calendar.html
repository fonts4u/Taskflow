<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        // Auth Guard: Redirect to login if no session exists or is being established
        async function authGuard() {
            const { data: { session: currentSession } } = await supabase.auth.getSession();
            if (currentSession) return;
            if (window.location.hash.includes('access_token=')) {
                const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
                    if (session) {
                        subscription.unsubscribe();
                        return;
                    }
                });
                setTimeout(async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) window.location.href = 'login.html';
                    subscription.unsubscribe();
                }, 3000);
                return;
            }
            window.location.href = 'login.html';
        }
        authGuard();

        // Listen for signed out event
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                window.location.href = 'login.html';
            }
        });
    </script>
    <style>
        :root {
            --primary: #E96A2C;
            --primary-soft: rgba(233, 106, 44, 0.1);
            --surface: #FFFFFF;
            --background: #FAFAFA;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .sidebar-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(0, 0, 0, 0.03);
        }

        .header-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-active {
            background: var(--primary-soft);
            color: var(--primary);
            box-shadow: inset -4px 0 0 var(--primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: rgba(0, 0, 0, 0.03);
        }

        .day-cell {
            min-height: 140px;
            background: white;
            padding: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .day-cell:hover {
            background: rgba(250, 250, 250, 0.8);
            z-index: 10;
            box-shadow: inset 0 0 0 1px var(--primary-soft);
        }

        .day-today {
            background: #FFF7F3;
            box-shadow: inset 0 0 0 2px #E96A2C;
        }

        .event-modal-content {
            background: white;
            border-radius: 3rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #CBD5E1;
        }

        .profile-dropdown {
            position: relative;
            cursor: pointer;
        }

        .dropdown-content {
            position: absolute;
            right: 0;
            top: calc(100% - 10px);
            min-width: 260px;
            padding-top: 20px;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
            pointer-events: none;
        }

        .profile-dropdown:hover .dropdown-content {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .dropdown-inner {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-5px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

    <script src="supabase-sync.js"></script>
    <script>
        let currentDate = new Date();

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex bg-white items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-slate-100 min-w-[320px] transition-all duration-500 transform translate-y-20 opacity-0`;

            const colorClass = isError ? 'text-rose-500' : 'text-emerald-500';
            const icon = isError ? 'report_problem' : 'verified';

            toast.innerHTML = `
                <div class="w-10 h-10 ${isError ? 'bg-rose-50' : 'bg-emerald-50'} rounded-xl flex items-center justify-center ${colorClass} shrink-0">
                    <span class="material-icons-round text-xl">${icon}</span>
                </div>
                <div>
                    <span class="font-bold text-slate-900 block text-sm">System Pulse</span>
                    <span class="text-xs text-slate-500">${message}</span>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        async function handleSeedDemo() {
            if (confirm('Load sample project and task data into your workspace?')) {
                showToast('Loading sample projects and tasks... Please wait.');
                await SyncService.seedDummyData();
                showToast('Sample data loaded successfully.');
                setTimeout(() => location.reload(), 1000);
            }
        }

        async function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            const tasks = await SyncService.getTasks();
            const events = await SyncService.getEvents();
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            title.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Previous month padding
            const prevMonthDate = new Date(year, month, 0);
            const prevDays = prevMonthDate.getDate();
            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'day-cell bg-slate-50/30 text-[10px] font-bold text-slate-200';
                cell.innerText = prevDays - i;
                grid.appendChild(cell);
            }

            // Current month
            const today = new Date();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const cell = document.createElement('div');
                const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
                cell.className = `day-cell text-[11px] font-bold ${isToday ? 'day-today' : ''}`;
                cell.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="${isToday ? 'text-[#E96A2C]' : 'text-slate-400'}">${d}</span>
                        ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-[#E96A2C]"></span>' : ''}
                    </div>
                    <div class="space-y-1.5 min-h-[60px] max-h-[80px] overflow-hidden"></div>
                `;
                cell.onclick = () => {
                    document.getElementById('eventDate').value = dateStr;
                    openEventModal();
                };

                const container = cell.querySelector('.space-y-1.5');
                const dayTasks = tasks.filter(t => t.due === dateStr);
                const dayEvents = events.filter(e => e.event_date === dateStr);

                // Show Tasks
                dayTasks.slice(0, 3).forEach(t => {
                    const color = t.priority === 'High' ? 'rose' : (t.priority === 'Medium' ? 'orange' : 'emerald');
                    container.innerHTML += `
                        <div class="text-[9px] bg-${color}-50 text-${color}-600 border border-${color}-100/50 p-1.5 rounded-lg truncate font-bold flex items-center gap-1.5" title="Task: ${t.title}">
                            <span class="w-1 h-1 rounded-full bg-${color}-500"></span>
                            ${t.title}
                        </div>
                    `;
                });

                // Show Events
                dayEvents.slice(0, 2).forEach(e => {
                    const color = e.color || 'orange';
                    const colors = color === 'rose' ? 'rose' : (color === 'orange' ? 'orange' : (color === 'emerald' ? 'emerald' : (color === 'indigo' ? 'indigo' : 'amber')));
                    container.innerHTML += `
                        <div class="text-[9px] bg-${colors}-50 text-${colors}-600 border border-${colors}-100/50 p-1.5 rounded-lg truncate font-bold flex items-center gap-1.5" title="Event: ${e.title}">
                            <span class="material-icons-round text-[10px]">event</span>
                            ${e.title}
                        </div>
                    `;
                });

                if (dayTasks.length + dayEvents.length > 5) {
                    container.innerHTML += `<div class="text-[8px] font-bold text-slate-300 text-center">+ ${dayTasks.length + dayEvents.length - 5} more</div>`;
                }

                grid.appendChild(cell);
            }

            // Next month padding
            const totalCells = grid.children.length;
            if (totalCells < 42) {
                for (let i = 1; i <= 42 - totalCells; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'day-cell bg-slate-50/30 text-[10px] font-bold text-slate-200';
                    cell.innerText = i;
                    grid.appendChild(cell);
                }
            }
        }

        function openEventModal() {
            const modal = document.getElementById('eventModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeEventModal() {
            const modal = document.getElementById('eventModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('eventForm').reset();
            }, 300);
        }

        document.getElementById('eventForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Synchronizing...';

            const event = {
                id: crypto.randomUUID(),
                title: document.getElementById('eventTitle').value,
                event_date: document.getElementById('eventDate').value,
                color: document.getElementById('eventColor').value,
                description: document.getElementById('eventDescription').value
            };

            await SyncService.saveEvent(event);

            closeEventModal();
            showToast('Changes saved.');
            await renderCalendar();

            btn.disabled = false;
            btn.innerText = originalText;
        };

        async function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); await renderCalendar(); }
        async function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); await renderCalendar(); }

        window.addEventListener('DOMContentLoaded', async () => {
            await SyncService.updateProfileUI();

            if (await SyncService.hasData()) {
                const seedBtn = document.getElementById('seedDemoBtn');
                if (seedBtn) seedBtn.classList.add('hidden');
            }

            await renderCalendar();
        });
    </script>
</body>
