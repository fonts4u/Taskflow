<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        :root {
            --primary: #E96A2C;
            --primary-soft: rgba(233, 106, 44, 0.1);
            --surface: #FFFFFF;
            --background: #FAFAFA;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .sidebar-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            border-right: 1px solid rgba(0, 0, 0, 0.03);
        }

        .header-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-active {
            background: var(--primary-soft);
            color: var(--primary);
            box-shadow: inset -4px 0 0 var(--primary);
        }

        .member-card {
            background: white;
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .member-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
    </style>
</head>

<body class="bg-[#FAFAFA] text-[#0F172A] overflow-hidden">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 sidebar-glass flex flex-col z-20">
            <div class="p-8 flex items-center gap-3">
                <div id="sidebarLogo" class="shrink-0"></div>
                <span class="text-2xl font-bold font-display tracking-tight text-slate-900 border-r pr-4 border-slate-200">TaskFlow</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-[#E96A2C]">Pro</span>
            </div>
            <nav class="flex-1 mt-6 px-4 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">dashboard</span>
                    Dashboard
                </a>
                <a href="projects.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">folder</span>
                    Projects
                </a>
                <a href="members.html" class="nav-active flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold transition-all group">
                    <span class="material-icons-round text-[20px]">people</span>
                    Team Members
                </a>
                <a href="kanban.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">view_kanban</span>
                    Kanban
                </a>
                <a href="calendar.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">calendar_month</span>
                    Calendar
                </a>
                <a href="analytics.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">bar_chart</span>
                    Analytics
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#FAFAFA]">
            <header class="h-20 header-glass flex items-center justify-between px-10 z-10 shrink-0">
                <div class="flex items-center gap-4">
                    <span class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">Team</span>
                    <span class="text-slate-300">/</span>
                    <span class="text-slate-900 text-xs font-bold uppercase tracking-widest bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">Management</span>
                </div>
                <div class="flex items-center gap-8">
                    <button onclick="openModal()" class="bg-[#E96A2C] text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-xl shadow-orange-500/30 active:scale-95 transition-all flex items-center gap-2 uppercase tracking-widest">
                        <span class="material-icons-round">person_add</span>
                        Invite Member
                    </button>
                    <div class="flex items-center gap-4 pl-8 border-l border-slate-200">
                        <div id="navProfileName" class="text-right hidden sm:block">
                            <p class="text-sm font-bold text-slate-900 leading-none">Alex Johnson</p>
                            <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-widest">Lead Member</p>
                        </div>
                        <img src="https://ui-avatars.com/api/?name=Alex+Johnson&background=E96A2C&color=fff" class="w-11 h-11 rounded-2xl" alt="User">
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-12 custom-scrollbar">
                <div class="max-w-7xl mx-auto">
                    <div class="mb-16">
                        <h1 class="text-5xl font-bold text-slate-900 tracking-tight leading-none mb-4">Team Members</h1>
                        <p class="text-slate-500 font-medium tracking-tight">Add and manage collaborators for your workspace.</p>
                    </div>

                    <div id="membersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Member Modal -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 animate-in zoom-in-95 duration-300 relative">
            <h3 id="modalTitle" class="text-2xl font-bold text-slate-900 mb-8 tracking-tight">New Team Member</h3>
            <form onsubmit="handleSaveMember(event)" id="memberForm" class="space-y-6">
                <input type="hidden" id="memberId">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Full Name</label>
                    <input type="text" id="memberName" placeholder="e.g. John Doe" class="w-full px-6 py-4 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Role / Title</label>
                    <input type="text" id="memberRole" placeholder="e.g. Product Designer" class="w-full px-6 py-4 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Email Address</label>
                    <input type="email" id="memberEmail" placeholder="john@example.com" class="w-full px-6 py-4 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold">
                </div>
                <div class="pt-4 flex gap-4">
                    <button type="button" onclick="closeModal()" class="flex-1 px-6 py-4 font-bold text-slate-400 hover:text-slate-600 transition-all uppercase tracking-widest text-xs">Cancel</button>
                    <button type="submit" class="flex-1 px-6 py-4 font-bold text-white bg-[#E96A2C] rounded-xl shadow-xl shadow-orange-500/20 uppercase tracking-widest text-xs">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-10 right-10 z-[100] flex flex-col gap-3"></div>

    <script src="supabase-sync.js"></script>
    <script>
        let members = [];

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex bg-white items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-slate-100 min-w-[300px] transition-all duration-500 transform translate-y-20 opacity-0`;
            toast.innerHTML = `
                <div class="w-10 h-10 ${isError ? 'bg-rose-50 text-rose-500' : 'bg-orange-50 text-[#E96A2C]'} rounded-xl flex items-center justify-center shrink-0">
                    <span class="material-icons-round text-xl">${isError ? 'error_outline' : 'verified'}</span>
                </div>
                <div class="text-xs font-bold text-slate-600">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 500); }, 4000);
        }

        async function loadMembers() {
            members = await SyncService.getAssignees();
            renderMembers();
        }

        function renderMembers() {
            const grid = document.getElementById('membersGrid');
            grid.innerHTML = '';
            members.forEach(m => {
                const card = document.createElement('div');
                card.className = 'member-card p-8 flex flex-col items-center text-center relative group';
                card.innerHTML = `
                    <div class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all">
                        <button onclick="deleteMember('${m.id}')" class="text-slate-300 hover:text-rose-500 transition-colors">
                            <span class="material-icons-round text-lg">delete_outline</span>
                        </button>
                    </div>
                    <img src="${m.avatar_url || 'https://ui-avatars.com/api/?name='+encodeURIComponent(m.name)}" class="w-24 h-24 rounded-[2rem] shadow-xl shadow-slate-200/50 mb-6" alt="${m.name}">
                    <h3 class="font-bold text-slate-900 text-lg mb-1 leading-tight">${m.name}</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">${m.role || m.job_title || 'Team Member'}</p>
                    <div class="w-full pt-6 border-t border-slate-50 flex justify-center gap-2">
                        <span class="px-3 py-1 bg-slate-50 text-[9px] font-black text-slate-400 rounded-lg uppercase tracking-widest">Active</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id = null) {
            if (id) {
                const m = members.find(x => x.id === id);
                document.getElementById('modalTitle').innerText = 'Edit Member';
                document.getElementById('memberId').value = m.id;
                document.getElementById('memberName').value = m.name;
                document.getElementById('memberRole').value = m.role || '';
                document.getElementById('memberEmail').value = m.email || '';
            } else {
                document.getElementById('modalTitle').innerText = 'New Team Member';
                document.getElementById('memberForm').reset();
                document.getElementById('memberId').value = '';
            }
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('memberModal').classList.add('hidden'); }

        async function handleSaveMember(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value || SyncService.generateId();
            const name = document.getElementById('memberName').value;
            const role = document.getElementById('memberRole').value;
            const email = document.getElementById('memberEmail').value;
            
            const assignee = {
                id, name, role, email,
                avatar_url: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&bold=true`
            };

            await SyncService.saveAssignee(assignee);
            showToast(document.getElementById('memberId').value ? 'Member updated' : 'Member invited successfully');
            closeModal();
            loadMembers();
        }

        async function deleteMember(id) {
            if (confirm('Are you sure you want to remove this member?')) {
                await SyncService.deleteAssignee(id);
                showToast('Member removed');
                loadMembers();
            }
        }

        window.addEventListener('load', async () => {
            const logo = document.getElementById('sidebarLogo');
            if (logo) logo.innerHTML = SyncService.LOGO_SVG;
            await SyncService.ensureInit();
            await SyncService.updateProfileUI();
            await loadMembers();
            SyncService.updateLinks();
        });
    </script>
</body>

</html>
