<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .premium-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(233, 106, 44, 0.05);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,rgba(233,106,44,0.05),transparent)]">
    <div class="max-w-md w-full text-center">
        <div class="premium-card rounded-[3rem] p-12 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
            
            <div class="w-20 h-20 bg-orange-50 text-[#E96A2C] rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-xl shadow-orange-500/10">
                <span class="material-icons-round text-4xl">mark_email_read</span>
            </div>
            
            <h1 class="text-3xl font-black text-slate-900 mb-4 tracking-tight font-display">Check your inbox</h1>
            <p class="text-slate-500 mb-10 font-medium leading-relaxed">
                We've sent a secure authorization link to your email. Please click the link to synchronize your workspace and begin.
            </p>
            
            <div class="space-y-4">
                <a href="login.html" class="block w-full bg-[#E96A2C] text-white py-5 rounded-2xl font-black text-sm tracking-widest uppercase shadow-xl shadow-orange-500/20 hover:scale-[1.02] transition-all">
                    Sign In after confirming
                </a>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">
                    Didn't receive it? Check your spam folder.
                </p>
            </div>
        </div>
        
        <p class="mt-12 text-sm text-slate-400 font-medium">
            &copy; 2026 TaskFlow Systems. All rights reserved.
        </p>
    </div>
</body>
</html>
