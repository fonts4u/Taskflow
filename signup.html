<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #E96A2C;
            --primary-hover: #D05A21;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(233, 106, 44, 0.05);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.05);
        }

        .btn-premium {
            background: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(233, 106, 44, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(233, 106, 44, 0.4);
        }

        .input-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(233, 106, 44, 0.1);
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,rgba(233,106,44,0.05),transparent)]">

    <div class="max-w-xl w-full">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-12">
            <div
                class="w-14 h-14 bg-[#E96A2C] rounded-2xl flex items-center justify-center text-white shadow-2xl shadow-orange-500/20 mb-6 transform rotate-12">
                <span class="material-icons-round text-3xl">bolt</span>
            </div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tight font-display">Create your account</h1>
            <p class="text-slate-500 mt-3 font-medium text-lg">Join 12k+ teams managing their work with TaskFlow.</p>
        </div>

        <!-- Form Container -->
        <div class="glass-container rounded-[3rem] p-12 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>

            <form action="dashboard.html" class="space-y-8 relative z-10">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Full Name</label>
                        <input type="text" placeholder="John Doe"
                            class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm"
                            required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Email Address</label>
                        <input type="email" placeholder="john@company.com"
                            class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm"
                            required>
                    </div>
                </div>

                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Organization</label>
                    <input type="text" placeholder="Acme Corp"
                        class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm"
                        required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Secure
                        Access Key</label>
                    <input type="password" placeholder="••••••••"
                        class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm"
                        required>
                    <div class="mt-4 flex gap-1.5 h-1.5">
                        <div class="flex-1 bg-orange-500 rounded-full shadow-sm shadow-orange-500/30"></div>
                        <div class="flex-1 bg-orange-500 rounded-full shadow-sm shadow-orange-500/30"></div>
                        <div class="flex-1 bg-slate-100 rounded-full"></div>
                        <div class="flex-1 bg-slate-100 rounded-full"></div>
                    </div>
                </div>

                <div class="flex items-start gap-4">
                    <input type="checkbox" id="terms"
                        class="mt-1 w-5 h-5 rounded-lg text-[#E96A2C] focus:ring-[#E96A2C] border-slate-200">
                    <label for="terms" class="text-sm text-slate-500 leading-relaxed font-medium">
                        I agree to the <a href="#"
                            class="text-[#E96A2C] font-bold hover:underline">Terms of Service</a>
                        and <a href="#" class="text-[#E96A2C] font-bold hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit"
                    class="w-full btn-premium text-white py-6 rounded-2xl font-black text-lg tracking-widest uppercase active:scale-[0.98] transition-all">
                    Create Account
                </button>
            </form>

            <div class="relative my-10 text-center">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-100"></div>
                </div>
                <span
                    class="relative bg-white px-6 text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] leading-none">Or sign up with</span>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <button id="googleSignup"
                    class="flex items-center justify-center gap-3 border border-slate-100 py-4 rounded-2xl hover:bg-slate-50 transition-all font-bold text-xs uppercase tracking-widest">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#EA4335"
                            d="M12.48 10.92v3.28h7.84c-.24 1.84-.91 3.22-1.92 4.28-1.2 1.2-3.07 2.48-6.11 2.48-4.85 0-8.64-3.92-8.64-8.77s3.79-8.77 8.64-8.77c2.98 0 5.17 1.15 6.53 2.48l2.31-2.31C18.98 1.18 16.19 0 12.48 0 5.86 0 .3 5.39.3 12s5.56 12 12.18 12c3.56 0 6.19-1.18 8.1-3.11 2.1-2.11 2.76-5.07 2.76-7.44 0-.71-.05-1.39-.16-2.03h-10.7z" />
                    </svg>
                    Continue with Google
                </button>
            </div>

            <div class="mt-12 pt-10 border-t border-slate-100 text-center">
                <div class="inline-flex flex-wrap justify-center gap-8 mb-8">
                    <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <span class="material-icons-round text-emerald-500 text-lg">verified</span>
                        Instant Provision
                    </div>
                    <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <span class="material-icons-round text-emerald-500 text-lg">lock</span>
                        Encrypted Ledger
                    </div>
                </div>
                <p class="text-sm text-slate-500 font-medium">Existing operative? <a href="login.html"
                        class="text-[#E96A2C] font-black hover:underline uppercase tracking-widest text-xs ml-2">Authenticate</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-10 right-10 z-[100] flex flex-col gap-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        // Redirect if already logged in
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = 'dashboard.html';
        }
        checkSession();

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex bg-white items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-slate-100 min-w-[320px] transition-all duration-500 transform translate-y-20 opacity-0`;

            const colorClass = isError ? 'text-rose-500' : 'text-[#E96A2C]';
            const icon = isError ? 'error_outline' : 'verified';

            toast.innerHTML = `
                <div class="w-10 h-10 ${isError ? 'bg-rose-50' : 'bg-orange-50'} rounded-xl flex items-center justify-center ${colorClass} shrink-0">
                    <span class="material-icons-round text-xl">${icon}</span>
                </div>
                <div>
                    <span class="font-bold text-slate-900 block text-sm">Deployment Pulse</span>
                    <span class="text-xs text-slate-500">${message}</span>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            const fullName = e.target.querySelectorAll('input')[0].value;
            const email = e.target.querySelectorAll('input')[1].value;
            const password = e.target.querySelectorAll('input')[3].value;

            btn.innerText = 'Provisioning...';
            btn.disabled = true;

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: window.location.origin + '/dashboard.html',
                        data: {
                            full_name: fullName,
                        }
                    }
                });

                if (error) throw error;

                showToast('Registration successful! Accessing Control Dashboard.');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (err) {
                showToast(err.message || 'Signup failed', true);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('googleSignup').addEventListener('click', async () => {
            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html'
                    }
                });
                if (error) throw error;
            } catch (err) {
                showToast(err.message || 'Google signup failed', true);
            }
        });
    </script>
</body>

</html>
