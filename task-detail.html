<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Detail | TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #E96A2C;
            --primary-soft: rgba(233, 106, 44, 0.1);
            --surface: #FFFFFF;
            --background: #FAFAFA;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .sidebar-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(0, 0, 0, 0.03);
        }

        .header-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-active {
            background: var(--primary-soft);
            color: var(--primary);
            box-shadow: inset -4px 0 0 var(--primary);
        }

        .detail-card {
            background: white;
            border-radius: 4rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.04);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #CBD5E1;
        }

        .profile-dropdown {
            position: relative;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            padding-top: 15px;
            /* The Bridge */
            min-width: 240px;
            z-index: 1000;
            transform-origin: top right;
            animation: dropdownFade 0.2s ease-out;
        }

        /* Invisible bridge to maintain hover */
        .dropdown-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
        }

        .dropdown-inner {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        .profile-dropdown:hover .dropdown-content {
            display: block;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-5px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body class="bg-[#FAFAFA] text-[#0F172A]">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 sidebar-glass flex flex-col z-20">
            <div class="p-8 flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-[#E96A2C] rounded-xl flex items-center justify-center text-white shadow-lg shadow-orange-500/20 shrink-0">
                    <span class="material-icons-round">bolt</span>
                </div>
                <span
                    class="text-2xl font-bold font-display tracking-tight text-slate-900 border-r pr-4 border-slate-200">TaskFlow</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-[#E96A2C]">Pro</span>
            </div>
            <nav class="flex-1 mt-6 px-4 space-y-2">
                <a href="dashboard.html"
                    class="nav-active flex items-center gap-3 px-4 py-4 rounded-2xl font-bold transition-all group">
                    <span class="material-icons-round text-[20px]">dashboard</span>
                    Dashboard
                </a>
                <a href="projects.html"
                    class="flex items-center gap-3 px-4 py-4 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">folder</span>
                    Projects
                </a>
                <a href="kanban.html"
                    class="flex items-center gap-3 px-4 py-4 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">view_kanban</span>
                    Kanban
                </a>
                <a href="calendar.html"
                    class="flex items-center gap-3 px-4 py-4 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span
                        class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">calendar_month</span>
                    Calendar
                </a>
                <a href="analytics.html"
                    class="flex items-center gap-3 px-4 py-4 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">bar_chart</span>
                    Analytics
                </a>
                <a href="settings.html"
                    class="flex items-center gap-3 px-4 py-4 rounded-2xl font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all group">
                    <span class="material-icons-round text-[20px] opacity-40 group-hover:opacity-100">settings</span>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#FAFAFA] overflow-y-auto">
            <header class="h-20 header-glass flex items-center justify-between px-10 z-10 shrink-0">
                <div class="flex items-center gap-6">
                    <a href="dashboard.html"
                        class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 hover:text-orange-600 hover:bg-orange-50 transition-all">
                        <span class="material-icons-round">arrow_back</span>
                    </a>
                    <div class="h-6 w-px bg-slate-200"></div>
                    <span
                        class="text-slate-900 text-[10px] font-bold uppercase tracking-[0.2em] bg-slate-100 px-3 py-1.5 rounded-lg">Initiative
                        Intelligence</span>
                </div>
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-4 pl-8 border-l border-slate-200">
                        <div class="profile-dropdown">
                            <div class="flex items-center gap-4 ml-4 group cursor-pointer">
                                <div class="text-right">
                                    <p class="text-sm font-bold text-slate-900 leading-none" id="navProfileName">Alex
                                        Johnson</p>
                                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-widest">
                                        Systems
                                        Lead</p>
                                </div>
                                <img src="https://ui-avatars.com/api/?name=Alex+Johnson&background=E96A2C&color=fff"
                                    class="w-11 h-11 rounded-2xl shadow-xl shadow-orange-500/10 group-hover:scale-105 transition-all"
                                    alt="User">
                            </div>
                            <div class="dropdown-content">
                                <div class="dropdown-inner">
                                    <a href="settings.html"
                                        class="flex items-center gap-3 px-6 py-4 text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-orange-500 transition-all">
                                        <span class="material-icons-round text-lg">settings</span>
                                        Settings
                                    </a>
                                    <div class="h-px bg-slate-50 mx-4"></div>
                                    <button onclick="SyncService.logout()"
                                        class="w-full flex items-center gap-3 px-6 py-4 text-sm font-bold text-rose-500 hover:bg-rose-50 transition-all">
                                        <span class="material-icons-round text-lg">logout</span>
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-12">
                <div class="max-w-4xl mx-auto">
                    <div id="taskDetailContent"
                        class="detail-card p-16 space-y-12 transition-all duration-700 transform">
                        <!-- Initial Skeleton State -->
                        <div class="space-y-10 animate-pulse">
                            <div class="flex justify-between items-start">
                                <div class="space-y-6 flex-1">
                                    <div class="w-32 h-6 bg-slate-100 rounded-lg"></div>
                                    <div class="w-2/3 h-16 bg-slate-100 rounded-2xl"></div>
                                </div>
                                <div class="w-40 h-10 bg-slate-50 rounded-2xl"></div>
                            </div>
                            <div class="grid grid-cols-3 gap-12 py-12 border-y border-slate-50">
                                <div class="h-12 bg-slate-50 rounded-xl"></div>
                                <div class="h-12 bg-slate-50 rounded-xl"></div>
                                <div class="h-12 bg-slate-50 rounded-xl"></div>
                            </div>
                            <div class="space-y-4">
                                <div class="w-full h-4 bg-slate-50 rounded-md"></div>
                                <div class="w-full h-4 bg-slate-50 rounded-md"></div>
                                <div class="w-3/4 h-4 bg-slate-50 rounded-md"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="taskModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
        <div
            class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl p-10 animate-in zoom-in-95 duration-300 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
            <h3 class="text-3xl font-bold text-slate-900 mb-8 tracking-tight">Modify Intelligence</h3>
            <form id="taskForm" onsubmit="handleSaveTask(event)" class="space-y-8 relative z-10">
                <input type="hidden" id="taskIdInput">
                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Intelligence
                        Identity</label>
                    <input type="text" id="titleInput"
                        class="w-full px-6 py-5 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-lg"
                        required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Initiative
                        Context</label>
                    <select id="projSelect"
                        class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold"></select>
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Urgency
                            Rating</label>
                        <select id="priorityInput"
                            class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm">
                            <option value="High">🔴 High Priority</option>
                            <option value="Medium">🟡 Standard</option>
                            <option value="Low">🟢 Casual</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Operational
                            Note</label>
                        <input type="text" id="descInput" placeholder="Quick brief..."
                            class="w-full px-6 py-4 rounded-2xl border-none bg-slate-50 focus:bg-white focus:ring-4 focus:ring-orange-500/10 outline-none transition-all font-bold text-sm">
                    </div>
                </div>
                <div class="pt-4 flex gap-4">
                    <button type="button" onclick="closeModal()"
                        class="flex-1 px-6 py-5 rounded-2xl font-bold text-slate-400 hover:text-slate-600 transition-all uppercase tracking-widest text-xs">Cancel</button>
                    <button type="submit"
                        class="flex-1 px-6 py-5 rounded-2xl font-bold text-white bg-[#E96A2C] shadow-2xl shadow-orange-500/30 hover:bg-orange-600 active:scale-95 transition-all uppercase tracking-widest text-xs">Apply
                        Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-10 right-10 z-[100] flex flex-col gap-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="supabase-sync.js"></script>
    <script>
        let currentTask = null;

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex bg-white items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-slate-100 min-w-[320px] transition-all duration-500 transform translate-y-20 opacity-0`;

            const colorClass = isError ? 'text-rose-500' : 'text-emerald-500';
            const icon = isError ? 'report_problem' : 'verified';

            toast.innerHTML = `
                <div class="w-10 h-10 ${isError ? 'bg-rose-50' : 'bg-emerald-50'} rounded-xl flex items-center justify-center ${colorClass} shrink-0">
                    <span class="material-icons-round text-xl">${icon}</span>
                </div>
                <div>
                    <span class="font-bold text-slate-900 block text-sm">System Pulse</span>
                    <span class="text-xs text-slate-500">${message}</span>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        async function renderTaskDetail() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const taskId = urlParams.get('id');
                if (!taskId) {
                    window.location.href = 'dashboard.html';
                    return;
                }

                const container = document.getElementById('taskDetailContent');
                const task = await SyncService.getTaskById(taskId);
                currentTask = task;

                if (!task) {
                    container.innerHTML = `
                        <div class="text-center py-20 flex flex-col items-center gap-6">
                            <div class="w-20 h-20 bg-slate-50 rounded-3xl flex items-center justify-center text-slate-300">
                                <span class="material-icons-round text-5xl">fmd_bad</span>
                            </div>
                            <div class="space-y-2">
                                <p class="text-slate-900 font-bold text-xl">Intelligence Missing</p>
                                <p class="text-slate-400 font-medium max-w-xs mx-auto">This operation payload could not be retrieved from the intelligence ledger.</p>
                            </div>
                            <button onclick="window.location.href='dashboard.html'" class="mt-4 px-8 py-3 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">Return to Command</button>
                        </div>`;
                    return;
                }

                const title = task.title || 'Untitled Intelligence';
                const project = task.project || 'Global Initiative';
                const priority = task.priority || 'Medium';
                const status = task.status || 'Active';
                const description = task.desc || task.description || 'No detailed intelligence available for this operation payload.';
                const id = task.id ? `#${task.id.slice(0, 8)}` : 'UNKNOWN';
                const due = task.due || 'ASAP Deployment';

                const priorityColor = priority === 'High' ? 'rose' : (priority === 'Medium' ? 'orange' : 'emerald');

                container.classList.add('opacity-0');

                setTimeout(() => {
                    container.innerHTML = `
                        <div class="flex justify-between items-start animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <div class="space-y-6">
                                <span class="text-[10px] font-bold uppercase tracking-[0.2em] px-4 py-2 bg-slate-50 text-slate-500 rounded-xl border border-slate-100">${project}</span>
                                <h1 class="text-5xl font-bold text-slate-900 tracking-tight leading-[1.1]">${title}</h1>
                            </div>
                            <div class="flex flex-col items-end gap-3 text-right">
                                <span class="flex items-center gap-2 text-[10px] font-bold text-${priorityColor}-600 uppercase tracking-widest bg-${priorityColor}-50 px-4 py-2.5 rounded-2xl border border-${priorityColor}-100">
                                     <span class="w-2 h-2 rounded-full bg-${priorityColor}-500 shadow-sm shadow-${priorityColor}-500/50"></span>
                                     ${priority} Priority
                                </span>
                                <span class="flex items-center gap-2 text-[10px] font-bold text-blue-600 uppercase tracking-widest bg-blue-50 px-4 py-2.5 rounded-2xl border border-blue-100">
                                    <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                                    ${status}
                                </span>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-12 py-12 border-y border-slate-50 animate-in fade-in slide-in-from-bottom-6 duration-700">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Intelligence Node</p>
                                <p class="text-slate-900 font-bold tracking-tight text-lg">${id}</p>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Temporal Goal</p>
                                <p class="text-slate-900 font-bold tracking-tight text-lg">${due}</p>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">System Integrity</p>
                                <p class="text-emerald-500 font-bold tracking-tight uppercase text-lg flex items-center gap-2"><span class="material-icons-round text-lg">verified</span> Verified</p>
                            </div>
                        </div>

                        <div class="space-y-6 animate-in fade-in slide-in-from-bottom-8 duration-1000">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mission Context & Narrative</p>
                            <p class="text-xl text-slate-600 font-medium leading-[1.6]">${description}</p>
                        </div>

                        <div class="pt-12 flex items-center justify-between border-t border-slate-50 animate-in fade-in duration-1000">
                            <div class="flex gap-4">
                                <button onclick="openEditModal()" class="bg-[#E96A2C] text-white px-8 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-xl shadow-orange-500/30 active:scale-95 transition-all flex items-center gap-2">
                                     <span class="material-icons-round">edit</span>
                                     Modify Intel
                                </button>
                                <button onclick="window.location.href='kanban.html?project=${encodeURIComponent(project)}'" class="bg-slate-50 text-slate-500 px-8 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-slate-100 transition-all active:scale-95 flex items-center gap-2">
                                     <span class="material-icons-round">view_kanban</span>
                                     Audit Board
                                </button>
                            </div>
                            <button onclick="history.back()" class="text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-900 transition-colors">Return to Ops</button>
                        </div>
                    `;
                    container.classList.remove('opacity-0');
                }, 300);
            } catch (err) {
                console.error('Handshake error:', err);
                const container = document.getElementById('taskDetailContent');
                container.innerHTML = `
                    <div class="text-center py-20 flex flex-col items-center gap-6">
                        <div class="w-20 h-20 bg-rose-50 rounded-3xl flex items-center justify-center text-rose-500">
                            <span class="material-icons-round text-5xl">emergency_home</span>
                        </div>
                        <div class="space-y-2">
                            <p class="text-slate-900 font-bold text-xl">Handshake Protocol Failed</p>
                            <p class="text-slate-400 font-medium">A communication error occurred with the intelligence server.</p>
                        </div>
                        <button onclick="location.reload()" class="mt-4 px-8 py-3 bg-[#E96A2C] text-white rounded-xl font-bold text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-orange-500/20">Retry Pulse</button>
                    </div>`;
            }
        }

        async function openEditModal() {
            if (!currentTask) return;
            const projects = await SyncService.getProjects();
            const s = document.getElementById('projSelect');
            if (s) {
                s.innerHTML = '';
                projects.forEach(p => { s.innerHTML += `<option value="${p.name}">${p.name}</option>`; });
            }

            document.getElementById('taskIdInput').value = currentTask.id;
            document.getElementById('titleInput').value = currentTask.title;
            document.getElementById('projSelect').value = currentTask.project;
            document.getElementById('priorityInput').value = currentTask.priority;
            document.getElementById('descInput').value = currentTask.desc || currentTask.description || '';

            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }

        async function handleSaveTask(e) {
            e.preventDefault();
            const task = {
                id: document.getElementById('taskIdInput').value,
                title: document.getElementById('titleInput').value,
                project: document.getElementById('projSelect').value,
                priority: document.getElementById('priorityInput').value,
                desc: document.getElementById('descInput').value,
                status: currentTask.status,
                column: currentTask.column
            };

            await SyncService.saveTask(task);
            closeModal();
            showToast('Intelligence updated successfully');
            await renderTaskDetail();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await SyncService.updateProfileUI();
            await renderTaskDetail();
        });
    </script>
</body>

</html>
